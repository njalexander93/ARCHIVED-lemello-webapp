name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/release.yml'
      - 'app/**'
      - 'contexts/**'
      - 'examples/**'
      - 'hooks/**'
      - 'lib/**'
      - 'public/**'
      - 'instrumentation.ts'
      - 'proxy.ts'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.cjs'
      - 'postcss.config.mjs'
      - 'jest.config.js'
      - 'jest.setup.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'Dockerfile'
      - 'package-lock.json'

# Prevent concurrent releases - queue them instead
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run E2E Tests
        run: npm run test:e2e:ci

  build-and-release:
    name: Continuous Deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for release-path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release_paths:
              - 'app/**'
              - 'contexts/**'
              - 'examples/**'
              - 'hooks/**'
              - 'lib/**'
              - 'public/**'
              - 'instrumentation.ts'
              - 'proxy.ts'
              - 'next.config.ts'
              - 'tailwind.config.ts'
              - 'tsconfig.json'
              - 'Dockerfile'
              - 'package-lock.json'

      - name: Extract Version
        if: steps.filter.outputs.release_paths == 'true'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Check Duplicate Version
        if: steps.filter.outputs.release_paths == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} &>/dev/null; then
            echo "❌ ERROR: Release v${{ steps.version.outputs.version }} already exists!"
            echo ""
            echo "This prevents Docker image/release version mismatch."
            echo "Please bump the version in package.json before merging."
            exit 1
          fi
          echo "✅ Version v${{ steps.version.outputs.version }} is unique"

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.release_paths == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.filter.outputs.release_paths == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/webapp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/webapp:latest

      - name: Create GitHub Release
        if: steps.filter.outputs.release_paths == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "## Release v${{ steps.version.outputs.version }}

            ### Docker Images
            \`\`\`
            docker pull ghcr.io/${{ github.repository_owner }}/webapp:${{ steps.version.outputs.version }}
            \`\`\`

            ### Changes
            See commit history for details." \
            --repo ${{ github.repository }}

      - name: Skip deployment for non-release changes
        if: steps.filter.outputs.release_paths == 'false'
        run: echo "✅ No release-path changes detected; deployment skipped."
