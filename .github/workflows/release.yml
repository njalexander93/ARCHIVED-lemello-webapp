name: Release Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'           # Skip markdown files (README, docs)
      - 'docs/**'         # Skip docs directory
      - 'scripts/**'      # Skip utility/test scripts
      - '.github/**'      # Skip workflow changes (use separate workflow for that)
      - 'LICENSE'         # Skip license changes
      - '.gitignore'      # Skip gitignore changes

# Prevent concurrent releases - queue them instead
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run e2e tests
        run: npm run test:e2e:ci

  build-and-release:
    name: Build and Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Verify version is unique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} &>/dev/null; then
            echo "❌ ERROR: Release v${{ steps.version.outputs.version }} already exists!"
            echo ""
            echo "This prevents Docker image/release version mismatch."
            echo "Please bump the version in package.json before merging."
            exit 1
          fi
          echo "✅ Version v${{ steps.version.outputs.version }} is unique"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/webapp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/webapp:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "## Release v${{ steps.version.outputs.version }}

            ### Docker Images
            \`\`\`
            docker pull ghcr.io/${{ github.repository_owner }}/webapp:${{ steps.version.outputs.version }}
            \`\`\`

            ### Changes
            See commit history for details." \
            --repo ${{ github.repository }}
