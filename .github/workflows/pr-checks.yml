name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Check format: [LMLO-XXX] Description starting with capital
          if ! echo "$PR_TITLE" | grep -qE '^\[LMLO-[0-9]+\] [A-Z]'; then
            echo "❌ PR title must match format: [LMLO-XXX] Description"
            echo "   - Must start with [LMLO-XXX] where XXX is a number"
            echo "   - Must have space after closing bracket"
            echo "   - Description must start with capital letter"
            echo ""
            echo "Your title: $PR_TITLE"
            exit 1
          fi

          echo "✅ PR title format is valid"

  label-check:
    name: Label Check
    runs-on: ubuntu-latest
    steps:
      - name: Check for required labels
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: "Bug, Documentation, Feature, Improvement, Spike, Task, Vulnerability"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version-check:
    name: Version Duplicate Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'contexts/**'
              - 'examples/**'
              - 'hooks/**'
              - 'lib/**'
              - 'public/**'
              - 'instrumentation.ts'
              - 'proxy.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'next.config.ts'
              - 'tailwind.config.ts'
              - 'tsconfig.json'

      - name: Extract version from package.json
        if: steps.filter.outputs.code == 'true'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if release exists
        if: steps.filter.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo ${{ github.repository }} &>/dev/null; then
            echo "❌ Release v$VERSION already exists!"
            echo ""
            echo "To bump the version:"
            echo "  1. Edit package.json line 3"
            echo "  2. Change version to next patch/minor/major"
            echo "  3. Commit: git commit -am 'Bump version to X.Y.Z'"
            echo ""
            echo "Version format: MAJOR.MINOR.PATCH"
            echo "  - PATCH (0.1.0 -> 0.1.1): Bug fixes"
            echo "  - MINOR (0.1.0 -> 0.2.0): New features (backward compatible)"
            echo "  - MAJOR (0.1.0 -> 1.0.0): Breaking changes"
            exit 1
          fi
          echo "✅ Version v$VERSION is unique"

      - name: Skip version check for docs-only changes
        if: steps.filter.outputs.code == 'false'
        run: |
          echo "✅ Only documentation/scripts changed - version check skipped"

  test-suite:
    name: Lint, Type Check, and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
